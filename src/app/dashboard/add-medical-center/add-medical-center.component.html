<div class="intro-y box p-5 mb-5 border border-gray-200 rounded-xl bg-white">

  <div class="flex items-center gap-2 mb-4">
    <i class="pi pi-search text-green-600 text-lg"></i>
    <h3 class="text-lg font-semibold text-gray-700">
      Advanced Search
    </h3>
  </div>

  <div class="grid grid-cols-12 gap-4 items-end">

    <!-- Clinic Name -->
    <div class="col-span-12 md:col-span-4">
      <label class="block text-sm font-medium mb-1">
        Clinic Name
      </label>

      <p-dropdown
        class="w-full"
        optionLabel="name"
        optionValue="id"
        [options]="DeptList"
        [(ngModel)]="selectDept"
        [filter]="true"
        appendTo="body">
      </p-dropdown>
    </div>

    <!-- Search Button -->
    <div class="col-span-12 md:col-span-2">
      <p-button
      [style]="{
    'background': '#22c55e',
    'color': 'white',
    'border-radius': '10px',
    'padding': '10px 22px',
    'font-weight': '600'
  }"
        label="Search"
        icon="pi pi-search"
        class="p-button-success w-full"
        (click)="Search()">
        
      </p-button>
    </div>

  </div>
</div>




<p-confirmDialog styleClass="custom-confirm-dialog" appendTo="body"></p-confirmDialog>
<div class="intro-y box p-5">

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-semibold text-gray-700">
     Clinecs List
    </h2>

    <p-button
      label="Add New"
      icon="pi pi-plus"
      styleClass="border-0 shadow-md transition-all duration-300 hover:shadow-lg"
      [style]="{
        'background': '#22c55e',
        'color': 'white',
        'border-radius': '10px',
        'padding': '10px 22px',
        'font-weight': '600'
      }"
      (click)="Addnew(0)">
    </p-button>
  </div>



  <p-table
  [value]="ClincList"
  [rows]="10"
  [paginator]="true"
  responsiveLayout="scroll"
  styleClass="p-datatable-sm p-datatable-gridlines"
  [rowHover]="true">

  <ng-template pTemplate="header">
    <tr class="bg-gray-100 text-sm">
      <th class="text-center">Name Center</th>
      <th class="text-center">Address</th>
      <th class="text-center">Emaile</th>
      <th class="text-center">PhonNumber</th>
      <th class="text-center">Actions</th>
    </tr>
  </ng-template>

<ng-template pTemplate="body" let-item>
  <tr>
    <td class="text-center">{{item.nameCenter}}</td>
    <td class="text-center">{{item.address}}</td>
    <td class="text-center">{{item.email}}</td>
    <td class="text-center">{{item.phonnumber}}</td>

    <!-- Actions Column -->
    
 <td class="px-4 py-3 text-center border-b">
          <div class="flex justify-center gap-2">

            <button
              class="text-blue-600 hover:text-blue-800 transition"
              title="Edit" (click)="Addnew(item.id)">
              <i class="pi pi-pencil"></i>
            </button>

            <button
              class="text-red-600 hover:text-red-800 transition"
              title="Delete" (click)="delete(item.id)">
              <i class="pi pi-trash"></i>
            </button>

          </div>
        </td>

  </tr>
</ng-template>
</p-table>
<p-confirmDialog key="deleteDialog" [rtl]="true" [style]="{width: '450px'}"></p-confirmDialog>
